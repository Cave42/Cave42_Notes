name: Update Notes List (PR)

on:
  push:
    paths:
      - 'Notes/**/*.html'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-notes-pr:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ github.token }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Update notes list
      run: node generate-notes-list.js
      
    - name: Check for changes
      id: changes
      run: |
        if [ -n "$(git status --porcelain index.html)" ]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "✨ Changes detected in notes list"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "📌 No changes in notes list"
        fi
        
    - name: Create Pull Request
      if: steps.changes.outputs.has_changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ github.token }}
        commit-message: '🤖 Auto-update notes list'
        title: '🤖 Update notes list with latest HTML files'
        body: |
          ## 🤖 Automated Notes List Update
          
          This PR was automatically created to update the notes list with newly detected HTML files.
          
          ### Changes:
          - Updated `index.html` with latest notes from the `Notes/` directory
          - Automatically detected file types (Marimo notebooks, presentations, etc.)
          - Organized notes by folder structure
          
          **Please review and merge when ready!**
        branch: update-notes-list
        delete-branch: true
        base: main