name: Manual Update Notes List

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ github.token }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Update notes list
      run: |
        echo "🔍 Scanning for HTML files..."
        node generate-notes-list.js
        echo "✅ Notes list generation complete"
        
    - name: Show detected changes
      run: |
        echo "📋 Current notes status:"
        if [ -n "$(git status --porcelain index.html)" ]; then
          echo "✨ Changes detected in index.html"
          git diff index.html
        else
          echo "📌 No changes detected in index.html"
        fi
      
    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: '🤖 Manual update of notes list'
        file_pattern: 'index.html'
        commit_user_name: 'github-actions[bot]'
        commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
        skip_dirty_check: ${{ github.event.inputs.force_update == 'true' }}